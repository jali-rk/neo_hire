# Builds the site and publishes it to GitHub Pages as a PREVIEW:
#   https://jali-rk.github.io/neo_hire/
# Runs on every push to main that touches site/, or manually from the Actions tab.
# NOINDEX=1 keeps search engines away while the content still has placeholders.
# For the real launch, remove NOINDEX and set SITE_URL to the final domain (see HANDOVER.md §10).
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy-preview.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          SITE_URL: https://jali-rk.github.io/neo_hire
          NOINDEX: '1'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
